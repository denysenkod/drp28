<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HairMatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=2026-06-01-admin-db-only" />
</head>
<body>
  <header class="topbar">
    <button class="brand-btn" id="home-btn" type="button">HairMatch</button>
    <nav class="top-actions" aria-label="Primary">
      <button class="nav-btn" id="search-nav-btn" type="button">Search</button>
      <button class="favourites-btn" id="favourites-btn" type="button">
        <span aria-hidden="true">&hearts;</span>
        <span>Saved</span>
        <span class="fav-count" id="fav-count">0</span>
      </button>
    </nav>
  </header>

  <main class="app-shell" id="app">
    <section class="results-grid" id="results-grid" hidden></section>
    <select data-filter="gender" hidden aria-hidden="true" tabindex="-1">
      <option value="">Gender</option>
    </select>
  </main>

  <div class="overlay" id="detail-overlay" hidden>
    <div class="overlay-card">
      <button class="close-btn" id="close-detail" type="button" aria-label="Close">&times;</button>

      <div class="detail-layout">
        <div class="detail-image" id="detail-image"></div>
        <div class="detail-copy">
          <p class="eyebrow" id="detail-meta">Style</p>
          <h2 id="detail-name">Style</h2>
          <p class="detail-description" id="detail-description"></p>

          <div class="detail-actions">
            <button class="primary-btn" id="detail-like" type="button">Save style</button>
            <button class="secondary-btn" id="detail-barber-open" type="button">Barber notes</button>
          </div>

          <dl class="detail-specs">
            <div>
              <dt>Length</dt>
              <dd id="detail-length"></dd>
            </div>
            <div>
              <dt>Texture</dt>
              <dd id="detail-hairtype"></dd>
            </div>
            <div>
              <dt>Gender</dt>
              <dd id="detail-gender"></dd>
            </div>
            <div>
              <dt>Upkeep</dt>
              <dd id="detail-maintenance-level"></dd>
            </div>
          </dl>
          <div class="admin-attribute-editor" id="detail-attribute-admin" hidden></div>

          <section class="detail-section">
            <h3>How to maintain it</h3>
            <p id="detail-maintenance"></p>
          </section>

          <section class="detail-section">
            <h3>Labels</h3>
            <div class="detail-labels" id="detail-labels"></div>
            <div class="admin-label-editor" id="detail-label-admin" hidden></div>
          </section>
        </div>
      </div>

      <section class="similar-section">
        <h3>More like this</h3>
        <div class="similar-results" id="similar-results"></div>
      </section>
    </div>
  </div>

  <div class="overlay" id="favourites-overlay" hidden>
    <div class="overlay-card">
      <button class="close-btn" id="close-favourites" type="button" aria-label="Close">&times;</button>
      <div class="overlay-heading">
        <p class="eyebrow">Your profile</p>
        <h2>Saved styles</h2>
      </div>
      <div class="results-grid" id="favourites-grid"></div>
      <p class="empty-state" id="favourites-empty">No saved styles yet. Like photos in search or results to build your profile.</p>
    </div>
  </div>

  <div class="overlay" id="barber-overlay" hidden>
    <div class="overlay-card overlay-card-small">
      <button class="close-btn" id="close-barber" type="button" aria-label="Close">&times;</button>
      <p class="eyebrow">Barber notes</p>
      <h2 id="barber-style-name">Style</h2>
      <p class="barber-text" id="barber-text"></p>
    </div>
  </div>

  <script src="/app.js?v=2026-06-01-admin-db-only"></script>
</body>
</html>
